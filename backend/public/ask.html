<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Ask</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f9f9f7;
    --card: #fcfcfb;
    --ink: #0b0b0b;
    --ink-2: #52514e;
    --border: rgba(11,11,11,0.12);
    --accent: #2a78d6;
    --error: #d03b3b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--ink);
  }
  .card {
    width: 100%;
    max-width: 560px;
    margin: 24px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 28px;
  }
  h1 { font-size: 18px; margin: 0 0 18px; }
  label { display: block; font-size: 13px; color: var(--ink-2); margin-bottom: 6px; }
  input, textarea {
    width: 100%;
    font: inherit;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--bg);
    color: var(--ink);
  }
  textarea { min-height: 100px; resize: vertical; }
  button {
    margin-top: 14px;
    padding: 10px 18px;
    font: inherit;
    font-weight: 600;
    color: #fff;
    background: var(--accent);
    border: none;
    border-radius: 8px;
    cursor: pointer;
  }
  button:disabled { opacity: 0.6; cursor: default; }
  .error { color: var(--error); font-size: 13px; margin-top: 10px; min-height: 16px; }
  .answer {
    margin-top: 18px;
    padding: 14px 16px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    white-space: pre-wrap;
    font-size: 14px;
    line-height: 1.5;
  }
  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
  .logout { font-size: 13px; color: var(--ink-2); background: none; border: none; padding: 0; margin: 0; text-decoration: underline; font-weight: 400; cursor: pointer; }
  [hidden] { display: none !important; }
</style>
</head>
<body>

  <div class="card" id="loginCard">
    <h1>Sign in</h1>
    <div class="error" id="loginHint" style="color: var(--ink-2);"></div>
    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password" />
    <div class="error" id="loginError"></div>
    <button id="loginBtn">Log in</button>
  </div>

  <div class="card" id="askCard" hidden>
    <div class="topbar">
      <h1 style="margin:0">Ask</h1>
      <button class="logout" id="logoutBtn">Log out</button>
    </div>
    <label for="question">Question</label>
    <textarea id="question" placeholder="Type a question…"></textarea>
    <div class="error" id="askError"></div>
    <button id="askBtn">Ask</button>
    <div class="answer" id="answer" hidden></div>
  </div>

<script>
  const loginCard = document.getElementById('loginCard');
  const askCard = document.getElementById('askCard');
  const passwordInput = document.getElementById('password');
  const loginBtn = document.getElementById('loginBtn');
  const loginError = document.getElementById('loginError');
  const questionInput = document.getElementById('question');
  const askBtn = document.getElementById('askBtn');
  const askError = document.getElementById('askError');
  const answerBox = document.getElementById('answer');
  const logoutBtn = document.getElementById('logoutBtn');

  function showAsk() {
    loginCard.hidden = true;
    askCard.hidden = false;
  }
  function showLogin() {
    askCard.hidden = true;
    loginCard.hidden = false;
    passwordInput.value = '';
    passwordInput.focus();
  }

  const nextPath = new URLSearchParams(location.search).get('next');
  if (nextPath) {
    document.getElementById('loginHint').textContent = 'Log in to continue to ' + nextPath;
  }

  async function checkSession() {
    const res = await fetch('/me');
    const data = await res.json();
    if (data.authed) {
      if (nextPath) { location.href = nextPath; return; }
      showAsk();
    } else {
      showLogin();
    }
  }

  async function login() {
    loginError.textContent = '';
    loginBtn.disabled = true;
    try {
      const res = await fetch('/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: passwordInput.value }),
      });
      const data = await res.json();
      if (!res.ok) {
        loginError.textContent = data.error || 'Login failed';
        return;
      }
      if (nextPath) { location.href = nextPath; return; }
      showAsk();
    } catch (e) {
      loginError.textContent = 'Could not reach the server.';
    } finally {
      loginBtn.disabled = false;
    }
  }

  async function ask() {
    const question = questionInput.value.trim();
    askError.textContent = '';
    if (!question) {
      askError.textContent = 'Type a question first.';
      return;
    }
    askBtn.disabled = true;
    answerBox.hidden = true;
    try {
      const res = await fetch('/ask', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question }),
      });
      const data = await res.json();
      if (!res.ok) {
        if (res.status === 401) { showLogin(); return; }
        askError.textContent = data.error || 'Something went wrong.';
        return;
      }
      answerBox.textContent = data.answer;
      answerBox.hidden = false;
    } catch (e) {
      askError.textContent = 'Could not reach the server.';
    } finally {
      askBtn.disabled = false;
    }
  }

  async function logout() {
    await fetch('/logout', { method: 'POST' });
    showLogin();
  }

  loginBtn.addEventListener('click', login);
  passwordInput.addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
  askBtn.addEventListener('click', ask);
  questionInput.addEventListener('keydown', e => { if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) ask(); });
  logoutBtn.addEventListener('click', logout);

  checkSession();
</script>
</body>
</html>
