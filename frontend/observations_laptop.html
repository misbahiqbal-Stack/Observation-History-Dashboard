<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Teacher Observation Score History</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* ── Design tokens ── */
  :root {
    --ground:       #f5f9f5;
    --text:         #1a2118;
    --accent:       #1b5e20;
    --accent-soft:  #e8f2e9;
    --accent-mid:   #c8e6c9;
    --amber:        #e8a217;
    --amber-soft:   #fef3cd;
    --border:       #cddece;
    --muted:        #56695a;
    --surface:      #ffffff;
    --up:           #2e7d32;
    --up-soft:      #e6f4ea;
    --steady:       #4a5c4d;
    --steady-soft:  #edf2ee;
    --down:         #c62828;
    --down-soft:    #fdeaea;
    --sidebar-w:    264px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  [hidden] { display: none !important; }

  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background: var(--ground);
    color: var(--text);
    height: 100vh;
    overflow: hidden;
    font-size: 13px;
    line-height: 1.5;
  }

  /* ════════════════════════════════
     LAYOUT
  ════════════════════════════════ */
  .layout {
    display: flex;
    height: 100vh;
  }

  /* ════════════════════════════════
     SIDEBAR
  ════════════════════════════════ */
  .sidebar {
    width: var(--sidebar-w);
    flex-shrink: 0;
    background: var(--accent);
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
  }

  .sidebar-head {
    padding: 22px 18px 18px;
    border-bottom: 1px solid rgba(255,255,255,.12);
  }

  .sidebar-eyebrow {
    font-size: 9.5px;
    font-weight: 700;
    letter-spacing: 1.4px;
    text-transform: uppercase;
    color: rgba(255,255,255,.5);
    margin-bottom: 5px;
  }

  .sidebar-title {
    font-family: 'DM Serif Display', Georgia, serif;
    font-size: 19px;
    color: #fff;
    line-height: 1.25;
    margin-bottom: 16px;
  }

  /* School select */
  .school-wrap { position: relative; }
  .school-wrap select {
    width: 100%;
    padding: 9px 30px 9px 11px;
    background: rgba(255,255,255,.1);
    border: 1px solid rgba(255,255,255,.2);
    border-radius: 7px;
    color: #fff;
    font-family: 'Inter', sans-serif;
    font-size: 12.5px;
    font-weight: 500;
    appearance: none;
    -webkit-appearance: none;
    cursor: pointer;
    outline: none;
    transition: background .15s;
  }
  .school-wrap select:focus { background: rgba(255,255,255,.16); }
  .school-wrap select option { background: #1b5e20; color: #fff; }
  .school-wrap::after {
    content: '▾';
    position: absolute;
    right: 9px; top: 50%;
    transform: translateY(-50%);
    color: rgba(255,255,255,.6);
    pointer-events: none;
    font-size: 11px;
  }

  /* Teacher list */
  .list-label {
    padding: 13px 18px 6px;
    font-size: 9.5px;
    font-weight: 700;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    color: rgba(255,255,255,.4);
  }

  .teacher-list {
    flex: 1;
    overflow-y: auto;
    padding: 0 8px 16px;
  }
  .teacher-list::-webkit-scrollbar { width: 3px; }
  .teacher-list::-webkit-scrollbar-thumb {
    background: rgba(255,255,255,.18);
    border-radius: 2px;
  }

  .t-item {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 8px 10px;
    border-radius: 7px;
    cursor: pointer;
    margin-bottom: 1px;
    transition: background .12s;
  }
  .t-item:hover { background: rgba(255,255,255,.09); }
  .t-item.active { background: var(--amber); }
  .t-item.active .t-name  { color: #1a2118; }
  .t-item.active .t-score { color: rgba(26,33,24,.65); }
  .t-item.active .t-arrow { opacity: 1; }

  .t-arrow {
    font-size: 14px;
    width: 14px;
    text-align: center;
    flex-shrink: 0;
    opacity: 1;
    font-weight: 700;
  }
  .t-name {
    flex: 1;
    font-size: 12.5px;
    font-weight: 500;
    color: rgba(255,255,255,.88);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .t-score {
    font-size: 11.5px;
    font-weight: 600;
    color: rgba(255,255,255,.55);
    flex-shrink: 0;
  }

  /* Sidebar controls */
  .sidebar-controls {
    padding: 8px 12px 6px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    border-bottom: 1px solid rgba(255,255,255,.1);
  }
  .sidebar-controls input[type="text"] {
    width: 100%;
    padding: 7px 10px;
    background: rgba(255,255,255,.1);
    border: 1px solid rgba(255,255,255,.18);
    border-radius: 6px;
    color: #fff;
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    outline: none;
  }
  .sidebar-controls input[type="text"]::placeholder { color: rgba(255,255,255,.38); }
  .sidebar-controls input[type="text"]:focus { border-color: rgba(255,255,255,.5); }
  .sort-filter-row {
    display: flex;
    gap: 6px;
    align-items: center;
  }
  .sort-filter-row select {
    flex: 1;
    padding: 5px 8px;
    background: rgba(255,255,255,.1);
    border: 1px solid rgba(255,255,255,.18);
    border-radius: 6px;
    color: #fff;
    font-family: 'Inter', sans-serif;
    font-size: 11px;
    appearance: none;
    -webkit-appearance: none;
    outline: none;
    cursor: pointer;
  }
  .filter-pills { display: flex; gap: 3px; }
  .fpill {
    padding: 4px 7px;
    background: rgba(255,255,255,.08);
    border: 1px solid rgba(255,255,255,.15);
    border-radius: 5px;
    color: rgba(255,255,255,.55);
    font-size: 11px;
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    cursor: pointer;
    transition: background .12s;
  }
  .fpill.active { background: rgba(255,255,255,.22); color: #fff; border-color: rgba(255,255,255,.35); }
  .fpill:hover { background: rgba(255,255,255,.15); }

  /* Chart legend */
  .chart-legend {
    display: flex;
    gap: 14px;
    margin-top: 6px;
    padding-left: 36px;
  }
  .chart-legend span {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 10.5px;
    color: var(--muted);
  }
  .legend-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  /* ════════════════════════════════
     MAIN AREA
  ════════════════════════════════ */
  .main {
    flex: 1;
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
    min-width: 0;
  }

  /* Top bar */
  .topbar {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0 28px;
    height: 56px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }
  .topbar-left { display: flex; align-items: center; gap: 10px; }
  .topbar-name {
    font-family: 'DM Serif Display', Georgia, serif;
    font-size: 19px;
    color: var(--text);
  }
  .topbar-meta {
    font-size: 12px;
    color: var(--muted);
  }

  /* KPI strip */
  .kpi-strip {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    flex-shrink: 0;
    min-height: 52px;
  }
  .kpi-strip > [style*="grid-column"] {
    border-right: none;
  }
  .kpi-cell {
    padding: 13px 20px;
    border-right: 1px solid var(--border);
  }
  .kpi-cell:last-child { border-right: none; }
  .kpi-lbl {
    font-size: 9.5px;
    font-weight: 700;
    letter-spacing: .9px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 3px;
  }
  .kpi-val {
    font-family: 'DM Serif Display', Georgia, serif;
    font-size: 24px;
    line-height: 1;
    color: var(--text);
  }
  .kpi-val.green { color: var(--accent); }
  .kpi-val.red   { color: var(--down); }
  .kpi-sub { font-size: 10.5px; color: var(--muted); margin-top: 2px; }

  /* Scrollable content */
  .content {
    flex: 1;
    overflow-y: auto;
    padding: 20px 28px 36px;
  }
  .content::-webkit-scrollbar { width: 5px; }
  .content::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  /* Two-column grid */
  .two-col {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    margin-bottom: 16px;
  }

  /* Cards */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 11px;
    padding: 20px;
  }
  .card-title {
    font-family: 'DM Serif Display', Georgia, serif;
    font-size: 15px;
    color: var(--text);
    margin-bottom: 1px;
  }
  .card-sub {
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 14px;
  }

  /* Teacher detail header */
  .detail-hd {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 22px;
    padding-bottom: 18px;
    border-bottom: 1px solid var(--border);
  }
  .detail-name {
    font-family: 'DM Serif Display', Georgia, serif;
    font-size: 26px;
    line-height: 1.15;
    color: var(--text);
  }
  .detail-school { font-size: 12px; color: var(--muted); margin-top: 3px; }
  .back-btn {
    flex-shrink: 0;
    background: var(--accent-soft);
    border: none; border-radius: 50%;
    width: 32px; height: 32px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; color: var(--accent);
    font-size: 17px; transition: background .15s;
    margin-top: 4px;
  }
  .back-btn:hover { background: var(--accent-mid); }

  /* Trend badge */
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 5px 13px;
    border-radius: 100px;
    font-size: 12px;
    font-weight: 600;
    flex-shrink: 0;
    margin-top: 4px;
  }
  .badge.up     { background: var(--up-soft);     color: var(--up); }
  .badge.steady { background: var(--steady-soft); color: var(--steady); }
  .badge.down   { background: var(--down-soft);   color: var(--down); }

  /* Indicator bars (CSS) */
  .ind-bars { display: flex; flex-direction: column; gap: 11px; }
  .ind-row-css {
    display: grid;
    grid-template-columns: 156px 1fr 44px;
    align-items: center;
    gap: 10px;
  }
  .ind-lbl {
    font-size: 11.5px;
    color: var(--muted);
    text-align: right;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .ind-track {
    height: 7px;
    background: var(--accent-soft);
    border-radius: 4px;
    overflow: hidden;
  }
  .ind-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 4px;
  }
  .ind-pct {
    font-size: 12px;
    font-weight: 700;
    color: var(--accent);
    text-align: right;
  }

  /* Month score tiles */
  .month-tiles {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 8px;
    margin-top: 14px;
  }
  .m-tile {
    background: var(--ground);
    border-radius: 9px;
    padding: 11px 6px;
    text-align: center;
    border: 1px solid var(--border);
    cursor: pointer;
    transition: box-shadow .15s;
  }
  .m-tile:hover { box-shadow: 0 2px 8px rgba(0,0,0,.08); }
  .m-tile.peak { background: var(--up-soft); border-color: var(--up-soft); }
  .m-tile.selected { background: var(--accent-soft); border-color: var(--accent); }
  .m-tile.selected .m-val { color: var(--accent); }
  .m-tile .m-lbl {
    font-size: 9.5px;
    font-weight: 700;
    letter-spacing: .7px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 4px;
  }
  .m-tile .m-val {
    font-family: 'DM Serif Display', Georgia, serif;
    font-size: 22px;
    color: var(--text);
    line-height: 1;
  }
  .m-tile.peak .m-val { color: var(--up); }
  .m-tile .m-subj {
    font-size: 9px;
    font-weight: 600;
    letter-spacing: .4px;
    text-transform: uppercase;
    color: var(--muted);
    margin-top: 5px;
    line-height: 1.3;
  }
  .visit-detail {
    margin-top: 14px;
    padding: 14px 16px;
    background: var(--accent-soft);
    border: 1px solid var(--border);
    border-radius: 10px;
    display: flex;
    gap: 24px;
    align-items: flex-start;
  }
  .visit-detail-hd {
    display: flex;
    flex-direction: column;
    gap: 4px;
    min-width: 72px;
  }
  .visit-detail-month {
    font-size: 9.5px;
    font-weight: 700;
    letter-spacing: .7px;
    text-transform: uppercase;
    color: var(--muted);
  }
  .visit-detail-score {
    font-family: 'DM Serif Display', Georgia, serif;
    font-size: 28px;
    color: var(--accent);
    line-height: 1;
  }
  .visit-detail-subj {
    font-size: 9px;
    font-weight: 600;
    letter-spacing: .4px;
    text-transform: uppercase;
    color: var(--muted);
    margin-top: 2px;
  }
  .visit-sub-boxes {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .visit-sub-name {
    font-size: 9px; font-weight: 700; letter-spacing: .5px;
    text-transform: uppercase; color: var(--accent);
    margin-bottom: 8px;
  }
  .visit-detail-inds {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
  }
  .visit-ind-row {
    background: var(--surface);
    border-radius: 7px;
    padding: 10px 12px;
    border: 1px solid var(--border);
  }
  .visit-ind-name {
    font-size: 9px;
    font-weight: 600;
    letter-spacing: .4px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 4px;
  }
  .visit-ind-val {
    font-family: 'DM Serif Display', Georgia, serif;
    font-size: 20px;
    color: var(--text);
  }
  .visit-cpd {
    margin-top: 14px;
    padding: 10px 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
  }
  .visit-cpd-label {
    font-size: 9px; font-weight: 700; letter-spacing: .5px;
    text-transform: uppercase; color: var(--muted);
    margin-bottom: 4px;
  }
  .visit-cpd-val {
    font-size: 13px; font-weight: 600; color: var(--text);
  }
  .collapsible-hd {
    cursor: pointer;
    user-select: none;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .collapsible-hd:hover { color: var(--accent); }
  .toggle-arrow { font-size: 11px; color: var(--muted); transition: transform .2s; }
  .collapsible-hd.open .toggle-arrow { transform: rotate(180deg); }

  /* Empty state */
  .empty {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 11px;
    padding: 52px 28px;
    text-align: center;
  }
  .empty-title {
    font-family: 'DM Serif Display', Georgia, serif;
    font-size: 19px;
    color: var(--muted);
    margin-bottom: 6px;
  }
  .empty-sub { font-size: 12.5px; color: var(--muted); }

  /* Indicator KPI row (school overview) */
  .ind-kpi-row {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    margin-top: 16px;
  }
  .ind-kpi-cell {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 18px;
  }
  .ind-kpi-lbl {
    font-size: 9.5px;
    font-weight: 700;
    letter-spacing: .8px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 6px;
  }
  .ind-kpi-val {
    font-family: 'DM Serif Display', Georgia, serif;
    font-size: 28px;
    line-height: 1;
    color: var(--accent);
  }
  .ind-kpi-sub {
    font-size: 10.5px;
    color: var(--muted);
    margin-top: 3px;
  }

  /* Footer note */
  .foot {
    font-size: 10.5px;
    color: var(--muted);
    text-align: center;
    margin-top: 20px;
  }

  /* ════════════════════════════════
     LOGIN OVERLAY
  ════════════════════════════════ */
  #loginOverlay {
    position: fixed; inset: 0;
    background: var(--accent);
    display: flex; align-items: center; justify-content: center;
    z-index: 1000;
  }
  #loginCard {
    background: #fff;
    border-radius: 14px;
    padding: 36px 32px 32px;
    width: 320px;
    box-shadow: 0 24px 64px rgba(0,0,0,.3);
  }
  #loginOrg {
    font-size: 11px; font-weight: 700; letter-spacing: .12em;
    text-transform: uppercase; color: var(--accent); margin-bottom: 6px;
  }
  #loginTitle {
    font-family: 'DM Serif Display', Georgia, serif;
    font-size: 22px; color: var(--text); margin-bottom: 24px;
  }
  #loginErr {
    background: #fdeaea; color: var(--down);
    font-size: 12px; padding: 8px 12px;
    border-radius: 7px; margin-bottom: 14px;
    border: 1px solid #f5c6c6;
  }
  #loginRolePills {
    display: flex; gap: 8px; margin-bottom: 22px;
  }
  .role-pill {
    flex: 1; padding: 7px 0; border-radius: 20px;
    border: 1.5px solid var(--border); background: transparent;
    font-family: 'Inter', sans-serif; font-size: 13px;
    color: var(--text-muted); cursor: pointer; transition: .15s;
  }
  .role-pill.active {
    background: var(--accent); border-color: var(--accent);
    color: #fff; font-weight: 600;
  }
  .role-pill:not(.active):hover {
    border-color: var(--accent); color: var(--accent);
  }
  #loginCoach, #loginPass {
    width: 100%; padding: 10px 0;
    border: none; border-bottom: 2px solid var(--border);
    font-family: 'Inter', sans-serif; font-size: 13.5px;
    color: var(--text); background: transparent;
    outline: none; margin-bottom: 18px;
    appearance: none; -webkit-appearance: none;
    cursor: pointer; transition: border-color .15s;
  }
  #loginCoach:focus, #loginPass:focus { border-bottom-color: var(--accent); }
  #loginPass { background: transparent; outline: none; color: var(--text); }
  #loginBtn {
    width: 100%; padding: 11px;
    background: var(--accent); color: #fff;
    border: none; border-radius: 8px;
    font-family: 'Inter', sans-serif; font-size: 14px; font-weight: 600;
    cursor: pointer; margin-top: 6px; transition: opacity .15s;
  }
  #loginBtn:hover { opacity: .88; }
  @keyframes shake {
    0%,100%{transform:translateX(0)} 20%{transform:translateX(-8px)}
    40%{transform:translateX(8px)}  60%{transform:translateX(-5px)}
    80%{transform:translateX(5px)}
  }
  .shake { animation: shake .35s ease; }

  /* ════════════════════════════════
     VISIT MODAL
  ════════════════════════════════ */
  #visitModal {
    position: fixed; inset: 0;
    background: rgba(0,0,0,.5);
    display: flex; align-items: center; justify-content: center;
    z-index: 900;
  }
  #visitCard {
    background: #fff; border-radius: 12px;
    padding: 28px 28px 24px; width: 290px;
    box-shadow: 0 16px 48px rgba(0,0,0,.22);
  }
  #visitTitle {
    font-family: 'DM Serif Display', Georgia, serif;
    font-size: 18px; color: var(--text); margin-bottom: 4px;
  }
  #visitSub { font-size: 12px; color: var(--muted); margin-bottom: 18px; }
  #visitErr {
    background: #fdeaea; color: var(--down);
    font-size: 12px; padding: 7px 10px;
    border-radius: 6px; margin-bottom: 12px;
    border: 1px solid #f5c6c6;
  }
  #visitCode {
    width: 100%; padding: 9px 0;
    border: none; border-bottom: 2px solid var(--border);
    font-family: 'Inter', sans-serif; font-size: 15px; font-weight: 700;
    letter-spacing: 2px; text-transform: uppercase;
    color: var(--text); background: transparent;
    outline: none; margin-bottom: 20px;
    transition: border-color .15s;
  }
  #visitCode:focus { border-bottom-color: var(--accent); }
  #visitBtns { display: flex; gap: 10px; }
  #visitBtns button {
    flex: 1; padding: 9px; border-radius: 7px; border: none;
    font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 600;
    cursor: pointer; transition: opacity .15s;
  }
  #visitBtns button:hover { opacity: .85; }
  #visitBtns button:first-child { background: var(--accent-soft); color: var(--accent); }
  #visitBtn { background: var(--accent); color: #fff; }

  /* User chip in topbar */
  .user-chip { display: flex; align-items: center; gap: 8px; }
  .user-name { font-size: 12.5px; font-weight: 500; color: var(--muted); }
  .chip-btn {
    display: flex; align-items: center; gap: 4px;
    padding: 5px 11px; border-radius: 6px;

const mean = a => { const v=a.filter(x=>x!=null); return v.length ? v.reduce((s,x)=>s+x,0)/v.length : null; };
const r1   = x => x!=null ? Math.round(x*10)/10 : null;

/* ── Share Report ── */
function buildReportText(d) {
  const monthLines = MONTHS.map((m,i)=>`${m}: ${d.months[i]!=null?d.months[i]+'%':'N/A'}`).join('\n');
  const indLines = INDICATORS.map((name,i)=>`${name}: ${d.cats[i]!=null?d.cats[i]+'%':'N/A'}`).join('\n');
  return `Observation Cycle Summary – ${d.name}\n`+
         `${d.school} · Coach: ${COACHES[d.school]||''}\n\n`+
         `Observation Average: ${d.obsAvg}%\n`+
         `Trend: ${tArrow(d.trend)} ${d.trend}\n\n`+
         `Monthly Scores (Sept–Feb):\n${monthLines}\n\n`+
         `Indicator Breakdown (Latest):\n${indLines}`;
}
function toggleShareMenu(e) {
  e.stopPropagation();
  const m = document.getElementById('shareMenu');
  if (m) m.hidden = !m.hidden;

function shareReport(channel) {
  const d = DATA.find(r=>r.name===selectedTeacher);

  const menu = document.getElementById('shareMenu');
  if (menu) menu.hidden = true;
  const text = buildReportText(d);
  if (channel === 'email') {
    const subject = `Observation Cycle Summary – ${d.name}`;
    const gmailUrl = `https://mail.google.com/mail/?view=cm&fs=1&su=${encodeURIComponent(subject)}&body=${encodeURIComponent(text)}`;
    window.open(gmailUrl, '_blank');
  } else if (channel === 'whatsapp') {
    window.open(`https://wa.me/?text=${encodeURIComponent(text)}`, '_blank');
  }
}

/* ── SVG line chart ── */
function lineChart(series, labels, h=180) {
  const W=500, H=h, pL=36, pR=12, pT=14, pB=26;
  const iw=W-pL-pR, ih=H-pT-pB;
  const allVals = series.flatMap(s=>s.values).filter(x=>x!=null);
  const yMin = Math.floor(Math.min(...allVals)/10)*10;
  const yMax  = Math.ceil( Math.max(...allVals)/10)*10 + 5;
  const xp = i => pL + iw*i/(labels.length-1);
  const yp = v => pT + ih - ih*(v-yMin)/(yMax-yMin);

  let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block">`;
  for (let v=yMin; v<=yMax; v+=10) {
    const y=yp(v);
    s += `<line x1="${pL}" y1="${y}" x2="${W-pR}" y2="${y}" stroke="#dceee0" stroke-width="1"/>`;
    s += `<text x="${pL-5}" y="${y+4}" font-size="10" fill="#56695a" text-anchor="end">${v}</text>`;
  }
  series.forEach(({values,color,fill,secondary})=>{
    const pts = values.map((v,i)=>v!=null?`${xp(i)},${yp(v)}`:null).filter(Boolean).join(' ');
    if(fill) s += `<polygon points="${xp(0)},${pT+ih} ${pts} ${xp(labels.length-1)},${pT+ih}" fill="${fill}" opacity="0.35"/>`;
    s += `<polyline points="${pts}" fill="none" stroke="${color}" stroke-width="${secondary?1.5:2.2}" stroke-dasharray="${secondary?'5,3':''}" stroke-linejoin="round" stroke-linecap="round" opacity="${secondary?.7:1}"/>`;
    if(!secondary) {
      const nonNull = values.filter(x=>x!=null);
      const minVal = nonNull.length ? Math.min(...nonNull) : null;
      values.forEach((v,i)=>{
        if(v==null) return;
        const isMin = v===minVal;
        const dc = isMin ? '#c62828' : color;
        s += `<circle cx="${xp(i)}" cy="${yp(v)}" r="${isMin?5:3.5}" fill="${dc}"/>`;
        s += `<text x="${xp(i)}" y="${yp(v)-8}" font-size="${isMin?10:9}" font-weight="${isMin?'700':'400'}" fill="${dc}" text-anchor="middle">${v}</text>`;
      });
    }
  });
  labels.forEach((lb,i)=>{
    s += `<text x="${xp(i)}" y="${H-3}" font-size="10" fill="#56695a" text-anchor="middle">${lb}</text>`;
  });
  s += '</svg>';
  return s;
}

/* ── SVG horizontal bar chart ── */
function barChart(items) {
  const W=460, H=items.length*38+16, pL=148, pR=52, pT=8, pB=8;
  const bH=22, gap=16;
  let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block">`;
  items.forEach(({label,value,color},i)=>{
    const y = pT + i*(bH+gap);
    const bw = (W-pL-pR)*value/100;
    s += `<text x="${pL-8}" y="${y+bH/2+4}" font-size="11.5" fill="#56695a" text-anchor="end">${label}</text>`;
    s += `<rect x="${pL}" y="${y}" width="${W-pL-pR}" height="${bH}" rx="4" fill="#e8f2e9"/>`;
    s += `<rect x="${pL}" y="${y}" width="${bw}" height="${bH}" rx="4" fill="${color}"/>`;
    s += `<text x="${pL+bw+7}" y="${y+bH/2+4}" font-size="11.5" font-weight="600" fill="${color}">${value}%</text>`;
  });
  s += '</svg>';
  return s;
}

/* ── Render sidebar teacher list ── */
function updateSearch(q) { searchQuery = q.trim().toLowerCase(); renderList(); }
function updateSort(v)   { sortBy = v; renderList(); }
function updateFilter(v) {
  filterTrend = v;
  document.querySelectorAll('.fpill').forEach(b => b.classList.toggle('active', b.dataset.trend === v));
  renderList();

function renderList() {
  if (!activeSchool) {
    document.getElementById('teacherList').innerHTML =
      '<div style="padding:18px 10px;color:rgba(255,255,255,.35);font-size:12px;text-align:center;line-height:1.6">Select a school above<br>to see its teachers</div>';
    return;
  }
  let set = getSet();
  if (searchQuery)        set = set.filter(d => d.name.toLowerCase().includes(searchQuery));
  if (filterTrend!=='all') set = set.filter(d => d.trend === filterTrend);
  if (sortBy==='name')       set = [...set].sort((a,b)=>a.name.localeCompare(b.name));
  if (sortBy==='score-asc')  set = [...set].sort((a,b)=>(a.obsAvg??0)-(b.obsAvg??0));
  if (sortBy==='score-desc') set = [...set].sort((a,b)=>(b.obsAvg??0)-(a.obsAvg??0));
  if (!set.length) {
    document.getElementById('teacherList').innerHTML =
      '<div style="padding:18px 10px;color:rgba(255,255,255,.35);font-size:12px;text-align:center">No teachers match</div>';
    return;
  }
  document.getElementById('teacherList').innerHTML = set.map(d => {
    const arrow = d.trend==="Improving"
      ? `<span style="color:#69f0ae">${tArrow(d.trend)}</span>`
      : d.trend==="Declining"
      ? `<span style="color:#ff5252">${tArrow(d.trend)}</span>`
      : `<span style="color:rgba(255,255,255,.7)">${tArrow(d.trend)}</span>`;
    return `<div class="t-item${selectedTeacher===d.name?' active':''}"
      onclick="selectTeacher('${d.name.replace(/'/g,"\\'")}')">
      <span class="t-arrow">${arrow}</span>
      <span class="t-name">${d.name}</span>
      <span class="t-score">${d.obsAvg!=null?d.obsAvg+'%':'N/A'}</span>
    </div>`;
  }).join('');
}

    const tc  = tClass(d.trend);
    const peak = Math.max(...d.months);

    const minCat  = Math.min(...d.cats.filter(x=>x!=null));
    const indBars = IND_SHORT.map((short,i)=>{
      const v = d.cats[i];
      const isMin = v!=null && v===minCat;
      return `
      <div class="ind-row-css">
        <div class="ind-lbl">${short}</div>
        <div class="ind-track"><div class="ind-fill" style="width:${v!=null?v:0}%;${isMin?'background:#c62828':''}"></div></div>
        <div class="ind-pct" style="${isMin?'color:#c62828':''}">${v!=null?v+'%':'N/A'}</div>
      </div>`;
    }).join('');

    const baseName  = d.name.replace(/ \(\d+ subjects?\)$/, '');
    const monthSubs = MONTH_SUBJECTS[d.school+'|'+baseName] || [];
    const tiles = d.months.map((v,i)=>{
      const subs = monthSubs[i] || [];
      const subLabel = subs.join(' · ');
      return `
      <div class="m-tile${v===peak?' peak':''}${selectedVisitIdx===i?' selected':(v==null?' no-data':'')}" ${v!=null?`onclick="selectVisit(${i})"`:'style="cursor:default"'}>
        <div class="m-lbl">${MONTHS[i]}</div>
        <div class="m-val">${v!=null?v:'N/A'}</div>
        ${subLabel?`<div class="m-subj">${subLabel}</div>`:''}
      </div>`;
    }).join('');

    el.innerHTML = `
      <div class="card" style="margin-bottom:16px">
        <div class="detail-hd">
          <div>
            <div class="detail-name">${d.name}</div>
            <div class="detail-school">${d.school} · Coach: ${COACHES[d.school]}</div>
          </div>
          <div style="display:flex;align-items:center;gap:10px;flex-shrink:0">
            <span class="badge ${tc}">${tArrow(d.trend)} ${d.trend}</span>
            <div class="share-wrap">
              <button class="chip-btn" onclick="toggleShareMenu(event)" title="Share this teacher's report">&#128228; Share Report</button>
              <div class="share-menu" id="shareMenu" hidden>
                <button onclick="shareReport('email')">&#9993; Email</button>
                <button onclick="shareReport('whatsapp')">&#128172; WhatsApp</button>
              </div>
            </div>
          </div>
        </div>

        <div class="two-col" style="margin-bottom:0">
          <div>
            <div class="card-title collapsible-hd open" onclick="toggleSection(this)">Observation Trends <span class="toggle-arrow">▾</span></div>
            <div>
              <div class="card-sub">Sept 2025 – Feb 2026</div>
              ${(()=>{
                const schoolSet = DATA.filter(r=>r.school===d.school);
                const schoolAvg = MONTHS.map((_,i)=>r1(mean(schoolSet.map(t=>t.months[i]))));
                return lineChart([
                  {values:d.months,  color:"#1b5e20", fill:"#c8e6c9"},
                  {values:schoolAvg, color:"#e8a217",  fill:null, secondary:true}
                ], MONTHS);
              })()}
              <div class="chart-legend">
                <span><span class="legend-dot" style="background:#1b5e20"></span>This teacher</span>
                <span><span class="legend-dot" style="background:#e8a217"></span>School avg</span>
              </div>
            </div>
          </div>
          <div>
            <div class="card-title collapsible-hd open" onclick="toggleSection(this)">Average Observation Indicators <span class="toggle-arrow">▾</span></div>
            <div>
              <div class="ind-bars" style="margin-top:8px">${indBars}</div>
            </div>
          </div>
        </div>

        <div style="margin-top:20px;padding-top:18px;border-top:1px solid var(--border)">
          <div class="card-title">Previous Observations</div>
          <div class="card-sub">Highest visit highlighted · Click any visit for details</div>
          <div class="month-tiles">${tiles}</div>
          <div id="visitDetail"></div>
        </div>
      </div>
      <div class="foot">Source: Teacher_Coaching_Master_Data &nbsp;·&nbsp; Obs Avg and Trend from source file &nbsp;·&nbsp; 4-Ind Avg = average of four latest indicator scores</div>`;
  } else {
    const set = getSet();
    const monthlyAvg = MONTHS.map((_,i)=>r1(mean(set.map(d=>d.months[i]))));
    const indAvgs    = INDICATORS.map((name,i)=>({
      name, short:IND_SHORT[i], value:r1(mean(set.map(d=>d.cats[i])))
    }));
    const validInds  = indAvgs.filter(a=>a.value!=null);
    const minInd     = validInds.length ? Math.min(...validInds.map(a=>a.value)) : null;
    const indItems   = validInds.map(({short,value})=>({label:short,value,color:value===minInd?'#c62828':'#1b5e20'}));

    const indKpiCards = indAvgs.map(({name,value})=>`
      <div class="ind-kpi-cell">
        <div class="ind-kpi-lbl">${name}</div>
        <div class="ind-kpi-val">${value!=null?value+'%':'N/A'}</div>
        <div class="ind-kpi-sub">school average</div>
      </div>`).join('');

    el.innerHTML = `
      <div class="two-col">
        <div class="card">
          <div class="card-title">Observation Trends</div>
          <div class="card-sub">School average · Sept 2025 – Feb 2026</div>
          ${lineChart([{values:monthlyAvg,color:"#1b5e20",fill:"#c8e6c9"}],MONTHS)}
        </div>
        <div class="card">
          <div class="card-title">Average Observation Indicators</div>
          <div class="card-sub">School average of four latest indicator scores</div>
          ${barChart(indItems)}
        </div>
      </div>
      <div class="empty" style="margin-top:16px">
        <div class="empty-title">Select a teacher from the list</div>
        <div class="empty-sub">Their monthly scores, indicator breakdown, and visit-by-visit trend will appear here.</div>
      </div>
      <div class="foot" style="margin-top:16px">Source: Teacher_Coaching_Master_Data &nbsp;·&nbsp; Obs Avg and Trend from source file &nbsp;·&nbsp; 4-Ind Avg = average of four latest indicator scores</div>`;
  }
}

/* ── Topbar ── */
function updateTopbar() {
  const left = document.getElementById('topbarLeft');
  const set = getSet();
  if (selectedTeacher) {
    const d = DATA.find(r=>r.name===selectedTeacher);
    left.innerHTML = `
      <button class="back-btn" onclick="goBack()" title="Back to school view" style="margin-top:0;flex-shrink:0">&#8592;</button>
      <div>
        <div class="topbar-name">${d.name}</div>
        <div class="topbar-meta">${d.school} · ${d.trend}</div>
      </div>`;
  } else if (!activeSchool) {
    left.innerHTML = `<div class="topbar-name">Observation Score History</div><div class="topbar-meta">Select a school to begin</div>`;
  } else {
    left.innerHTML = `<div class="topbar-name">${activeSchool}</div><div class="topbar-meta">${set.length} teachers · <span style="font-weight:700;color:var(--accent)">Coach</span> ${COACHES[activeSchool]||""}</div>`;
  }
}

/* ── Events ── */
function onSchoolChange() {
  activeSchool    = document.getElementById('schoolSel').value;
  selectedTeacher = null;
  searchQuery     = '';
  filterTrend     = 'all';
  const s = document.getElementById('teacherSearch'); if(s) s.value='';
  document.querySelectorAll('.fpill').forEach(b=>b.classList.toggle('active',b.dataset.trend==='all'));
  refresh();
}
function toggleSection(hd) {
  const body = hd.nextElementSibling;
  const isHidden = body.hidden;
  body.hidden = !isHidden;
  hd.classList.toggle('open', isHidden);
}
function selectVisit(idx) {
  const _d = DATA.find(r=>r.name===selectedTeacher);
  if (!_d || _d.months[idx] == null) return;
  selectedVisitIdx = (selectedVisitIdx === idx) ? null : idx;
  document.querySelectorAll('.m-tile').forEach((t,i) => {
    t.classList.toggle('selected', i === selectedVisitIdx);
  });
  const panel = document.getElementById('visitDetail');
  if (selectedVisitIdx === null) { panel.innerHTML = ''; return; }
  const d = DATA.find(r=>r.name===selectedTeacher);
  const score = d.months[selectedVisitIdx];
  const bn = d.name.replace(/ \(\d+ subjects?\)$/, '');
  const ms = MONTH_SUBJECTS[d.school+'|'+bn] || [];
  const subs = ms[selectedVisitIdx] || [];
  const subList = subs.length ? subs : [''];
  const indCards = INDICATORS.map(name=>`
    <div class="visit-ind-row">
      <div class="visit-ind-name">${name}</div>
      <div class="visit-ind-val">N/A</div>
    </div>`).join('');
  const subBoxes = subList.map(sub => {
    const cpd = (sub ? CPD_SUBJECT_DATA[d.school+'|'+bn.toLowerCase()+'|'+sub] : null)
             || CPD_DATA[d.school+'|'+bn.toLowerCase()]
             || null;
    const cpdHtml = cpd ? `
      <div class="visit-cpd">
        <div class="visit-cpd-label">CPD Recommendation</div>
        <div class="visit-cpd-val">${cpd}</div>
      </div>` : '';
    return `
      <div class="visit-sub-box">
        ${sub ? `<div class="visit-sub-name">${sub}</div>` : ''}
        <div class="visit-detail-inds">${indCards}</div>
        ${cpdHtml}
      </div>`;
  }).join('');
  panel.innerHTML = `
    <div class="visit-detail">
      <div class="visit-detail-hd">
        <span class="visit-detail-month">${MONTHS[selectedVisitIdx]}</span>
        <span class="visit-detail-score">${score!=null?score+'%':'N/A'}</span>
      </div>
      <div class="visit-sub-boxes">${subBoxes}</div>
    </div>`;
}
function goBack() {
  selectedTeacher = null;
  selectedVisitIdx = null;
  refresh();
}
function selectTeacher(name) {
  selectedTeacher = selectedTeacher===name ? null : name;
  selectedVisitIdx = null;
  refresh();
}
function refresh() {
  renderList();
  renderKPIs();
  updateTopbar();
  renderContent();
}

/* ── Auth ── */
function initLoginDropdowns() {
  rebuildNameDropdown();
}

function rebuildNameDropdown() {
  const sel = document.getElementById('loginCoach');
  sel.innerHTML = '<option value="" disabled selected>Select your name…</option>';
  Object.entries(USER_DB)
    .filter(([, u]) => u.role === loginRole)
    .sort(([,a],[,b]) => a.name.localeCompare(b.name))
    .forEach(([k, u]) => {
      const opt = document.createElement('option');
      opt.value = k; opt.textContent = u.name;
      sel.appendChild(opt);
    });
}

function setLoginRole(role) {
  loginRole = role;
  document.getElementById('pillCoach').classList.toggle('active', role === 'coach');
  document.getElementById('pillPrincipal').classList.toggle('active', role === 'principal');
  document.getElementById('loginCoach').value = '';
  document.getElementById('loginPass').value = '';
  document.getElementById('loginErr').hidden = true;
  rebuildNameDropdown();
}

function onCoachSelect() {
  document.getElementById('loginErr').hidden = true;
  document.getElementById('loginPass').value = '';
  document.getElementById('loginPass').focus();
}

function rebuildSchoolDropdown() {
  const sel = document.getElementById('schoolSel');
  const schools = sessionSchools === null ? Object.keys(COACHES) : sessionSchools;
  sel.innerHTML = `<option value="" disabled${!activeSchool?' selected':''}>Select a school…</option>` +
    schools.map(s=>`<option value="${s}"${activeSchool===s?' selected':''}>${s}</option>`).join('');
  if (activeSchool && !schools.includes(activeSchool)) {
    activeSchool = ''; selectedTeacher = null;
  }
}

function _applyLogin(username, school) {
  const user = USER_DB[username];
  currentUser    = user;
  sessionSchools = user.schools ? [...user.schools] : null;
  sessionStorage.setItem('obs_user', username);
  document.getElementById('loginOverlay').hidden = true;
  document.getElementById('chipName').textContent = user.name;
  const chip = document.getElementById('userChip');
  chip.hidden = false;
  document.getElementById('addSchoolBtn').hidden = (sessionSchools === null);
  rebuildSchoolDropdown();
  if (school && sessionSchools && sessionSchools.includes(school)) {
    activeSchool = school;
    document.getElementById('schoolSel').value = activeSchool;
  } else if (sessionSchools && sessionSchools.length >= 1) {
    activeSchool = sessionSchools[0];
    document.getElementById('schoolSel').value = activeSchool;
  }
  refresh();
}

function doLogin() {
  const coachKey = document.getElementById('loginCoach').value;
  const pass     = document.getElementById('loginPass').value;
  const errEl    = document.getElementById('loginErr');
  const card     = document.getElementById('loginCard');
  function shake() { card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake'); }
  if (!coachKey) { errEl.textContent = 'Please select your name.';    errEl.hidden = false; shake(); return; }
  if (!pass)     { errEl.textContent = 'Please enter your password.'; errEl.hidden = false; shake(); return; }
  const user = USER_DB[coachKey];
  if (!user || user.pass !== pass) { errEl.textContent = 'Incorrect password.'; errEl.hidden = false; shake(); return; }
  errEl.hidden = true;
  _applyLogin(coachKey);
}

function doLogout() {
  currentUser = null; sessionSchools = [];
  activeSchool = ''; selectedTeacher = null;
  sessionStorage.removeItem('obs_user');
  document.getElementById('loginOverlay').hidden = false;
  document.getElementById('loginPass').value = '';
  document.getElementById('loginErr').hidden = true;
  document.getElementById('userChip').hidden = true;
  loginRole = 'coach';
  document.getElementById('pillCoach').classList.add('active');
  document.getElementById('pillPrincipal').classList.remove('active');
  rebuildNameDropdown();
  rebuildSchoolDropdown();
  refresh();
  setTimeout(() => document.getElementById('loginCoach').focus(), 50);
}

function openVisit() {
  document.getElementById('visitCode').value = '';
  document.getElementById('visitErr').hidden = true;
  document.getElementById('visitModal').hidden = false;
  setTimeout(() => document.getElementById('visitCode').focus(), 50);
}

function closeVisit() {
  document.getElementById('visitModal').hidden = true;
}

function doVisit() {
  const code   = (document.getElementById('visitCode').value || '').trim().toUpperCase();
  const school = SCHOOL_CODES[code];
  const errEl  = document.getElementById('visitErr');
  if (!school) {
    errEl.textContent = 'Access code not recognised.';
    errEl.hidden = false; return;
  }
  if (sessionSchools && sessionSchools.includes(school)) {
    errEl.textContent = `${school} is already unlocked.`;
    errEl.hidden = false; return;
  }
  if (sessionSchools) sessionSchools.push(school);
  closeVisit();
  rebuildSchoolDropdown();
  refresh();
}

document.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    if (!document.getElementById('loginOverlay').hidden) { doLogin(); return; }
    if (!document.getElementById('visitModal').hidden)   { doVisit(); return; }
  }
  if (e.key === 'Escape' && !document.getElementById('visitModal').hidden) closeVisit();
});

initLoginDropdowns();
const _savedUser = sessionStorage.getItem('obs_user');
if (_savedUser && USER_DB[_savedUser]) {
  _applyLogin(_savedUser);
} else {
  refresh();
}
</script>
</body>
</html>
