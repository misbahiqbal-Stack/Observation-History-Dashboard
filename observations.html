<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>Teacher Observations</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
<style>
  :root {
    --primary:         #1b5e20;
    --on-primary:      #ffffff;
    --primary-cont:    #c8e6c9;
    --on-primary-cont: #002106;
    --secondary-cont:  #dcedc8;
    --on-sec-cont:     #1b2a13;
    --surface:         #f6faf6;
    --on-surface:      #191c19;
    --surf-var:        #dce6dc;
    --on-surf-var:     #424742;
    --outline:         #727872;
    --outline-var:     #c1ccc1;
    --surf-cont:       #e8f0e8;
    --background:      #f0f5f0;
    --disabled-bg:     #c3c7cf;
    --disabled-text:   #73777f;
    --up:   #2e7d32;
    --down: #c62828;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Roboto', Helvetica, Arial, sans-serif;
    background: var(--background);
    color: var(--on-surface);
    max-width: 430px;
    margin: 0 auto;
    position: relative;
  }

  /* ── Screen management ── */
  .screen { display: none; min-height: 100vh; }
  .screen.active { display: block; }

  /* ── App Bar ── */
  .app-bar {
    background: var(--surf-cont);
    height: 64px;
    display: flex;
    align-items: center;
    padding: 0 4px 0 4px;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 1px 2px rgba(0,0,0,.08), 0 2px 6px rgba(0,0,0,.05);
    gap: 4px;
  }
  .app-bar .bar-title {
    font-size: 22px;
    font-weight: 400;
    color: var(--on-surface);
    flex: 1;
    padding-left: 4px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .icon-btn {
    width: 48px; height: 48px;
    border-radius: 50%;
    border: none;
    background: transparent;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    color: var(--on-surface);
    flex-shrink: 0;
  }
  .icon-btn:hover { background: rgba(0,0,0,.06); }

  /* ══════════════════════════════
     HOME SCREEN
  ══════════════════════════════ */
  .home-content {
    padding: 24px 16px 40px;
  }
  .welcome-block {
    margin-bottom: 28px;
  }
  .welcome-block h2 {
    font-size: 20px;
    font-weight: 500;
    margin-bottom: 4px;
  }
  .welcome-block p {
    font-size: 14px;
    color: var(--on-surf-var);
    line-height: 1.5;
  }

  /* MD3 outlined field */
  .md-field {
    position: relative;
    margin-bottom: 20px;
  }
  .md-field label {
    position: absolute;
    top: -9px; left: 12px;
    background: var(--background);
    padding: 0 4px;
    font-size: 12px;
    font-weight: 500;
    color: var(--primary);
    z-index: 1;
    pointer-events: none;
  }
  .md-field select {
    width: 100%;
    padding: 16px 48px 16px 16px;
    border: 1.5px solid var(--outline);
    border-radius: 4px;
    font-family: 'Roboto', Helvetica, Arial, sans-serif;
    font-size: 16px;
    color: var(--on-surface);
    background: var(--background);
    appearance: none;
    -webkit-appearance: none;
    outline: none;
    cursor: pointer;
  }
  .md-field select:focus { border-color: var(--primary); border-width: 2px; }
  .md-field select:disabled {
    color: var(--disabled-text);
    border-color: var(--outline-var);
    cursor: not-allowed;
    background: var(--surf-var);
  }
  .md-field .chevron {
    position: absolute;
    right: 12px; top: 50%;
    transform: translateY(-50%);
    pointer-events: none;
    color: var(--on-surf-var);
    font-size: 22px;
  }

  /* Filled button */
  .btn-filled {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    padding: 16px 24px;
    margin-top: 8px;
    background: var(--primary);
    color: var(--on-primary);
    border: none;
    border-radius: 100px;
    font-family: 'Roboto', Helvetica, Arial, sans-serif;
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
  }
  .btn-filled:disabled {
    background: var(--disabled-bg);
    color: var(--disabled-text);
    cursor: not-allowed;
  }
  .btn-filled:not(:disabled):active { opacity: 0.82; }

  /* ══════════════════════════════
     OBSERVATION SCREEN
  ══════════════════════════════ */
  .obs-content {
    padding: 16px 16px 96px;
  }

  /* Teacher header card */
  .teacher-header {
    background: var(--primary);
    color: var(--on-primary);
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 12px;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
  }
  .teacher-header .th-name {
    font-size: 20px;
    font-weight: 500;
    line-height: 1.2;
  }
  .teacher-header .th-school {
    font-size: 13px;
    opacity: .82;
    margin-top: 4px;
  }
  .trend-chip {
    border-radius: 100px;
    padding: 4px 10px;
    font-size: 12px;
    font-weight: 700;
    white-space: nowrap;
    flex-shrink: 0;
    margin-top: 2px;
  }
  .trend-chip.up   { background: #e6f4ea; color: var(--up); }
  .trend-chip.down { background: #fdeaea; color: var(--down); }
  .trend-chip.steady { background: rgba(255,255,255,.22); color: #fff; }

  /* Summary row */
  .summary-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-bottom: 12px;
  }
  .summary-card {
    background: var(--primary-cont);
    border-radius: 12px;
    padding: 12px 6px;
    text-align: center;
  }
  .summary-card .s-val {
    font-size: 20px;
    font-weight: 700;
    color: var(--primary);
    line-height: 1.1;
  }
  .summary-card .s-lbl {
    font-size: 10.5px;
    color: var(--on-primary-cont);
    margin-top: 4px;
    line-height: 1.3;
  }

  /* Section label */
  .sec-label {
    font-size: 11px;
    font-weight: 500;
    letter-spacing: .7px;
    text-transform: uppercase;
    color: var(--on-surf-var);
    margin: 16px 0 8px;
  }

  /* Card */
  .md-card {
    background: var(--surf-cont);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 12px;
  }
  .md-card .card-title {
    font-size: 13px;
    font-weight: 500;
    color: var(--on-surf-var);
    margin-bottom: 12px;
    text-transform: uppercase;
    letter-spacing: .5px;
    font-size: 11px;
  }

  /* Indicator rows */
  .ind-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px solid var(--outline-var);
  }
  .ind-row:last-child { border-bottom: none; }
  .ind-row .ind-name {
    flex: 1;
    font-size: 13.5px;
    color: var(--on-surface);
    line-height: 1.3;
  }
  .score-bar {
    width: 64px; height: 5px;
    background: var(--outline-var);
    border-radius: 3px;
    overflow: hidden;
    flex-shrink: 0;
  }
  .score-bar-fill {
    height: 100%;
    background: var(--primary);
    border-radius: 3px;
  }
  .ind-row .ind-score {
    font-size: 14px;
    font-weight: 700;
    color: var(--primary);
    min-width: 44px;
    text-align: right;
  }

  /* Observation history cards */
  .obs-card {
    background: #fff;
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 12px;
    box-shadow: 0 1px 2px rgba(0,0,0,.07);
  }
  .date-badge {
    background: var(--secondary-cont);
    color: var(--on-sec-cont);
    border-radius: 10px;
    padding: 8px 10px;
    text-align: center;
    min-width: 50px;
    flex-shrink: 0;
  }
  .date-badge .db-month { font-size: 10px; font-weight: 500; letter-spacing: .5px; }
  .date-badge .db-day   { font-size: 22px; font-weight: 700; line-height: 1.1; }
  .date-badge .db-year  { font-size: 10px; color: var(--on-surf-var); }
  .obs-card .obs-info   { flex: 1; }
  .obs-card .obs-visit  { font-size: 14px; font-weight: 500; }
  .obs-card .obs-coach  { font-size: 12px; color: var(--on-surf-var); margin-top: 2px; }
  .obs-card .obs-score-wrap { text-align: right; flex-shrink: 0; }
  .obs-card .obs-score  { font-size: 20px; font-weight: 700; color: var(--primary); }
  .obs-card .obs-score-lbl { font-size: 10px; color: var(--on-surf-var); }

  /* ══════════════════════════════
     ADD OBSERVATION SCREEN
  ══════════════════════════════ */
  .add-content {
    padding: 24px 16px 96px;
  }

  .score-input-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 14px 0;
    border-bottom: 1px solid var(--outline-var);
  }
  .score-input-row:last-child { border-bottom: none; }
  .score-input-row .ind-name  { font-size: 14px; line-height: 1.3; flex: 1; }

  .score-stepper {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
  }
  .score-stepper .step-btn {
    width: 36px; height: 36px;
    border-radius: 50%;
    border: 1.5px solid var(--outline);
    background: transparent;
    color: var(--primary);
    font-size: 22px;
    font-weight: 300;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    line-height: 1;
    font-family: 'Roboto', Helvetica, Arial, sans-serif;
  }
  .score-stepper .step-btn:active { background: var(--primary-cont); }
  .score-stepper .step-val {
    font-size: 20px;
    font-weight: 700;
    color: var(--primary);
    min-width: 24px;
    text-align: center;
  }

  .md-field input[type="date"],
  .md-field textarea {
    width: 100%;
    padding: 16px;
    border: 1.5px solid var(--outline);
    border-radius: 4px;
    font-family: 'Roboto', Helvetica, Arial, sans-serif;
    font-size: 16px;
    color: var(--on-surface);
    background: var(--background);
    outline: none;
  }
  .md-field input[type="date"]:focus,
  .md-field textarea:focus {
    border-color: var(--primary);
    border-width: 2px;
  }
  .md-field textarea { resize: vertical; }

  .bottom-bar {
    position: fixed;
    bottom: 0; left: 50%;
    transform: translateX(-50%);
    width: 100%; max-width: 430px;
    background: var(--surf-cont);
    padding: 12px 16px;
    box-shadow: 0 -1px 4px rgba(0,0,0,.10);
    z-index: 60;
  }
  .bottom-bar .btn-filled { margin-top: 0; }

  /* ── Accordion ── */
  .acc-wrap {
    margin-bottom: 10px;
    border-radius: 12px;
    overflow: hidden;
    border: 1px solid var(--outline-var);
  }
  .acc-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px;
    background: var(--surf-cont);
    cursor: pointer;
    user-select: none;
  }
  .acc-header:hover { background: var(--primary-cont); }
  .acc-title {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: .6px;
    text-transform: uppercase;
    color: var(--primary);
  }
  .acc-chevron {
    color: var(--primary);
    transition: transform .25s ease;
    font-size: 22px;
  }
  .acc-body {
    display: none;
    background: var(--background);
  }
  .acc-body .md-card {
    border-radius: 0;
    margin-bottom: 0;
  }
  .acc-body .obs-card:last-child { margin-bottom: 0; }

  /* Extended FAB */
  .fab-ext {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    height: 56px;
    padding: 0 20px 0 14px;
    background: var(--primary-cont);
    color: var(--primary);
    border-radius: 16px;
    border: none;
    display: flex; align-items: center; gap: 8px;
    box-shadow: 0 3px 8px rgba(0,0,0,.18), 0 1px 3px rgba(0,0,0,.12);
    cursor: pointer;
    font-family: 'Roboto', Helvetica, Arial, sans-serif;
    font-size: 14px; font-weight: 500;
    z-index: 50;
  }
</style>
</head>
<body>

<!-- ══════════════════════════════════════
     SCREEN 1: HOME
══════════════════════════════════════ -->
<div class="screen active" id="screen-home">

  <div class="app-bar">
    <span class="bar-title">Teacher Observations</span>
    <button class="icon-btn"><span class="material-icons-round">more_vert</span></button>
  </div>

  <div class="home-content">
    <div class="welcome-block">
      <h2>Select a teacher</h2>
      <p>Choose a school first, then pick a teacher to view their observation history.</p>
    </div>

    <div class="md-field">
      <label>School</label>
      <select id="schoolSelect" onchange="onSchoolChange()">
        <option value="">Choose school…</option>
        <option>Al-Noor Academy</option>
        <option>Bright Future School</option>
        <option>City Grammar School</option>
        <option>Daanish Public School</option>
        <option>Evergreen Institute</option>
        <option>Falcon Academy</option>
        <option>Greenwood Public School</option>
        <option>Horizon Model School</option>
        <option>Iqra Education Centre</option>
        <option>Junior Scholars Academy</option>
        <option>Knowledge Valley School</option>
        <option>Lighthouse Academy</option>
      </select>
      <span class="material-icons-round chevron">expand_more</span>
    </div>

    <div class="md-field">
      <label>Teacher</label>
      <select id="teacherSelect" disabled onchange="onTeacherChange()">
        <option value="">Choose school first…</option>
      </select>
      <span class="material-icons-round chevron">expand_more</span>
    </div>

    <button class="btn-filled" id="viewBtn" disabled onclick="goToObservations()">
      <span class="material-icons-round" style="font-size:20px">visibility</span>
      View Observations
    </button>
  </div>

</div><!-- /screen-home -->


<!-- ══════════════════════════════════════
     SCREEN 2: TEACHER OBSERVATIONS
══════════════════════════════════════ -->
<div class="screen" id="screen-obs">

  <div class="app-bar">
    <button class="icon-btn" onclick="showScreen('screen-home')">
      <span class="material-icons-round">arrow_back</span>
    </button>
    <span class="bar-title" id="obsBarTitle">Observations</span>
  </div>

  <div class="obs-content" id="obsContent">
    <!-- filled by renderObsScreen() -->
  </div>

  <button class="fab-ext" id="fabAdd" style="display:none" onclick="showScreen('screen-add')">
    <span class="material-icons-round">add</span>
    Add Observation
  </button>

</div><!-- /screen-obs -->


<!-- ══════════════════════════════════════
     SCREEN 3: ADD OBSERVATION
══════════════════════════════════════ -->
<div class="screen" id="screen-add">

  <div class="app-bar">
    <button class="icon-btn" onclick="showScreen('screen-obs')">
      <span class="material-icons-round">arrow_back</span>
    </button>
    <span class="bar-title">Add Observation</span>
  </div>

  <div class="add-content">

    <!-- Date picker -->
    <div class="md-field" style="margin-bottom:24px">
      <label>Observation Date</label>
      <input type="date" id="obsDate" />
    </div>

    <!-- Indicator scores -->
    <div class="sec-label">Indicator Scores (1 – 4)</div>
    <div class="md-card" style="margin-bottom:20px">
      <div class="score-input-row">
        <span class="ind-name">Lesson Objective Clarity</span>
        <div class="score-stepper">
          <button class="step-btn" onclick="adj('sv1',-1)">−</button>
          <span class="step-val" id="sv1">2</span>
          <button class="step-btn" onclick="adj('sv1', 1)">+</button>
        </div>
      </div>
      <div class="score-input-row">
        <span class="ind-name">Student Engagement</span>
        <div class="score-stepper">
          <button class="step-btn" onclick="adj('sv2',-1)">−</button>
          <span class="step-val" id="sv2">2</span>
          <button class="step-btn" onclick="adj('sv2', 1)">+</button>
        </div>
      </div>
      <div class="score-input-row">
        <span class="ind-name">Classroom Management</span>
        <div class="score-stepper">
          <button class="step-btn" onclick="adj('sv3',-1)">−</button>
          <span class="step-val" id="sv3">2</span>
          <button class="step-btn" onclick="adj('sv3', 1)">+</button>
        </div>
      </div>
      <div class="score-input-row">
        <span class="ind-name">Differentiated Instruction</span>
        <div class="score-stepper">
          <button class="step-btn" onclick="adj('sv4',-1)">−</button>
          <span class="step-val" id="sv4">2</span>
          <button class="step-btn" onclick="adj('sv4', 1)">+</button>
        </div>
      </div>
    </div>

    <!-- Notes -->
    <div class="md-field">
      <label>Notes / Comments</label>
      <textarea id="obsNotes" rows="5" placeholder="Write your observation notes here…"></textarea>
    </div>

  </div><!-- /add-content -->

  <!-- Fixed save bar -->
  <div class="bottom-bar">
    <button class="btn-filled">
      <span class="material-icons-round" style="font-size:20px">save</span>
      Save Observation
    </button>
  </div>

</div><!-- /screen-add -->

/* ── Screen navigation ── */
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0, 0);
}

/* ── Home screen logic ── */
function onSchoolChange() {
  const school = document.getElementById('schoolSelect').value;
  const sel    = document.getElementById('teacherSelect');
  sel.innerHTML = '';
  if (!school) {
    sel.innerHTML = '<option value="">Choose school first…</option>';
    sel.disabled  = true;
  } else {
    const ph = document.createElement('option');
    ph.value = ''; ph.textContent = 'Choose teacher…';
    sel.appendChild(ph);
    TEACHER_LIST[school].forEach(name => {
      const o = document.createElement('option');
      o.value = o.textContent = name;
      sel.appendChild(o);
    });
    sel.disabled = false;
  }
  document.getElementById('viewBtn').disabled = true;
}

function onTeacherChange() {
  document.getElementById('viewBtn').disabled =
    !document.getElementById('teacherSelect').value;
}

function toggleAcc(id) {
  const body    = document.getElementById(id);
  const chevron = document.getElementById('chev-' + id);
  const opening = body.style.display !== 'block';
  body.style.display          = opening ? 'block' : 'none';
  chevron.style.transform     = opening ? 'rotate(180deg)' : '';
}

function adj(id, delta) {
  const el = document.getElementById(id);
  const v  = Math.min(4, Math.max(1, parseInt(el.textContent) + delta));
  el.textContent = v;
}

function goToObservations() {
  const school  = document.getElementById('schoolSelect').value;
  const teacher = document.getElementById('teacherSelect').value;
  if (!school || !teacher) return;
  renderObsScreen(teacher, school);
  showScreen('screen-obs');
}

/* ── SVG line chart ── */
function drawChart(months) {
  const W=360, H=155, pL=30, pR=10, pT=18, pB=24;
  const iw=W-pL-pR, ih=H-pT-pB;
  const yMin = Math.floor(Math.min(...months)/10)*10;
  const yMax  = Math.ceil( Math.max(...months)/10)*10 + 5;
  const xp = i => pL + iw*i/5;
  const yp = v => pT + ih - ih*(v-yMin)/(yMax-yMin);

  let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block">`;

  /* grid lines */
  for (let v=yMin; v<=yMax; v+=10) {
    s += `<line x1="${pL}" y1="${yp(v)}" x2="${W-pR}" y2="${yp(v)}" stroke="#dfe2eb" stroke-width="1"/>`;
    s += `<text x="${pL-4}" y="${yp(v)+4}" font-size="9" fill="#73777f" text-anchor="end">${v}</text>`;
  }

  /* area fill */
  const pts = months.map((v,i) => `${xp(i)},${yp(v)}`).join(' ');
  s += `<polygon points="${xp(0)},${pT+ih} ${pts} ${xp(5)},${pT+ih}" fill="#c8e6c9" opacity="0.55"/>`;

  /* line */
  s += `<polyline points="${pts}" fill="none" stroke="#1b5e20" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`;

  /* dots + score labels */
  months.forEach((v,i) => {
    s += `<circle cx="${xp(i)}" cy="${yp(v)}" r="4" fill="#1b5e20"/>`;
    s += `<text x="${xp(i)}" y="${yp(v)-8}" font-size="9" fill="#1b5e20" text-anchor="middle">${v}</text>`;
  });

  /* month labels */
  MONTHS.forEach((m,i) => {
    s += `<text x="${xp(i)}" y="${H-2}" font-size="9" fill="#73777f" text-anchor="middle">${m}</text>`;
  });

  s += '</svg>';
  return s;
}

/* ── Render observation screen ── */
function renderObsScreen(teacherName, school) {
  const d      = DATA.find(r => r.name === teacherName && r.school === school);
  const coach  = COACHES[school] || 'Coach';
  const tClass = d.trend === 'Improving' ? 'up' : d.trend === 'Declining' ? 'down' : 'steady';
  const tLabel = d.trend === 'Improving' ? '↑ Improving' : d.trend === 'Declining' ? '↓ Declining' : '→ Steady';

  /* app bar title */
  document.getElementById('obsBarTitle').textContent = teacherName;

  /* indicator rows */
  const indRows = INDICATORS.map((name, i) => `
    <div class="ind-row">
      <span class="ind-name">${name}</span>
      <div class="score-bar"><div class="score-bar-fill" style="width:${d.cats[i]}%"></div></div>
      <span class="ind-score">${d.cats[i]}%</span>
    </div>`).join('');

  /* observation history cards (newest first) */
  const obsCards = [...d.months].reverse().map((score, i) => {
    const dt = OBS_DATES[i];
    return `
    <div class="obs-card">
      <div class="date-badge">
        <div class="db-month">${dt.month}</div>
        <div class="db-day">${dt.day}</div>
        <div class="db-year">${dt.year}</div>
      </div>
      <div class="obs-info">
        <div class="obs-visit">Observation ${6 - i}</div>
        <div class="obs-coach">Coach: ${coach}</div>
      </div>
      <div class="obs-score-wrap">
        <div class="obs-score">${score}%</div>
        <div class="obs-score-lbl">Score</div>
      </div>
    </div>`;
  }).join('');

  document.getElementById('obsContent').innerHTML = `
    <div class="teacher-header">
      <div>
        <div class="th-name">${teacherName}</div>
        <div class="th-school">${school}</div>
      </div>
      <span class="trend-chip ${tClass}">${tLabel}</span>
    </div>

    <div class="summary-row">
      <div class="summary-card">
        <div class="s-val">6</div>
        <div class="s-lbl">Total Observations</div>
      </div>
      <div class="summary-card">
        <div class="s-val">${d.obsAvg}%</div>
        <div class="s-lbl">Average Score</div>
      </div>
      <div class="summary-card">
        <div class="s-val">Feb '26</div>
        <div class="s-lbl">Latest Visit</div>
      </div>
    </div>

    <div class="acc-wrap">
      <div class="acc-header" onclick="toggleAcc('acc-monthly')">
        <span class="acc-title">Monthly Scores</span>
        <span class="material-icons-round acc-chevron" id="chev-acc-monthly">expand_more</span>
      </div>
      <div class="acc-body" id="acc-monthly">
        <div class="md-card">${drawChart(d.months)}</div>
      </div>
    </div>

    <div class="acc-wrap">
      <div class="acc-header" onclick="toggleAcc('acc-indicators')">
        <span class="acc-title">Average by Indicator</span>
        <span class="material-icons-round acc-chevron" id="chev-acc-indicators">expand_more</span>
      </div>
      <div class="acc-body" id="acc-indicators">
        <div class="md-card">${indRows}</div>
      </div>
    </div>

    <div class="acc-wrap">
      <div class="acc-header" onclick="toggleAcc('acc-history')">
        <span class="acc-title">Observation History</span>
        <span class="material-icons-round acc-chevron" id="chev-acc-history">expand_more</span>
      </div>
      <div class="acc-body" id="acc-history" style="padding:8px">
        ${obsCards}
      </div>
    </div>
  `;

  document.getElementById('fabAdd').style.display = 'flex';
}
