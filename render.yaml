# Render Blueprint — defines BOTH the production and staging services.
# Render reads this from the repo root; `rootDir` points each service at backend/.
#
# PLAN: `free` spins down after ~15 min idle (~50s cold start, and in-memory sessions
# are lost so everyone is logged out). Change production's plan to `starter` for true
# 24/7. Staging is deliberately left on `free` — it does not need to stay warm.
#
# SECRETS: every env var below is `sync: false`, meaning Render does NOT read its value
# from this file — you enter it once in the dashboard. Never put a real value in here;
# this file is committed.
#
# NOTE: PORT is deliberately absent. Render assigns it and server.js already reads
# process.env.PORT. Setting it yourself breaks the health check.

services:
  # ─────────────────────────── PRODUCTION (branch: main) ───────────────────────────
  - type: web
    name: observation-dashboard
    runtime: node
    plan: free                 # ← change to `starter` for 24/7 (no spin-down)
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    branch: main
    autoDeployTrigger: commit
    envVars:
      - key: APP_USERNAME
        sync: false
      - key: APP_PASSWORD
        sync: false
      - key: COACH_PASSWORD
        sync: false
      - key: PRINCIPAL_PASSWORD
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-5

  # ──────────────────────────── STAGING (branch: staging) ──────────────────────────
  # Same code, separate URL, separate credentials, separate API key budget.
  - type: web
    name: observation-dashboard-staging
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    branch: staging
    autoDeployTrigger: commit
    envVars:
      - key: APP_USERNAME
        sync: false
      - key: APP_PASSWORD
        sync: false
      - key: COACH_PASSWORD
        sync: false
      - key: PRINCIPAL_PASSWORD
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-5
